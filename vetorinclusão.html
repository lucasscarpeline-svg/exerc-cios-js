<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor Inclusão e Exclusão</title>
</head>

<body>
    <script>
        var lista_carros = Array()
        lista_carros(0) = 'Fusca'
        lista_carros(1) = 'Kombi'
        lista_carros(2) = 'Corcel'
        lista_carros(3) = 'Belina'
        lista_carros(4) = 'Brasilia'

        console.log(lista_carros);
        
        //console.log(lista_carros.sart(''))
        //console.log(lista_carros.indexOf('Brasilia'))

        console.log(lista_carros);
        /*Comandos de Inclusão Array
           lista_carros.unshift('Onix')
           lista_carros.push('Virtus')
           */
        //Comandos de Exclusão Array
           lista_carros.shift()
           lista_carros.pop()
           console.log(lista_carros);
    </script>
</body>

</html>
