    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
    <script>

        var km = Number(prompt('digite o km percorrido: '));
        var its = Number(prompt('digite o volume consumido: '));

        function calcularMedia(a,b){
            var media = a / b;
            return media;
        }
          
            var result = calcularMedia(km, its);
            document.write(Math.round(result));

 


    </script>
