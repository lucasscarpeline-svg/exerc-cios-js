<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

    var nome = prompt('Qual seu nome');
    var salario = Number(prompt('Qual é seu salario'));
    var venda = Number(prompt('Qual foi sua venda'));
    var comissao = 0;
 

    comissao = venda * 0.025;
    salario = salario + comissao;
    
   
    document.write('<h1>Ola ' + nome + ' você irá receber' + salário
      + 'esse mês<h1>')

  </script>
</body>

</html>
